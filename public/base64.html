<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Base64 编码/解码 - 在线工具箱</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #f7fafc;
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        header h1 { font-size: 1.8rem; }
        .back-btn {
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            border: 2px solid white;
            border-radius: 6px;
            transition: background 0.3s ease;
        }
        .back-btn:hover { background: rgba(255, 255, 255, 0.2); }
        .editor-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        @media (max-width: 768px) { .editor-container { grid-template-columns: 1fr; } }
        .editor-box {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .editor-box h3 { margin-bottom: 15px; color: #2d3748; }
        textarea {
            width: 100%;
            height: 300px;
            padding: 15px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
            font-size: 14px;
            resize: vertical;
            line-height: 1.5;
        }
        textarea:focus { outline: none; border-color: #667eea; }
        .button-group { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        button {
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.3s ease;
        }
        .btn-primary { background: #667eea; color: white; }
        .btn-primary:hover { background: #5a6fd6; }
        .btn-secondary { background: #e2e8f0; color: #4a5568; }
        .btn-secondary:hover { background: #cbd5e0; }
        .btn-danger { background: #fc8181; color: white; }
        .btn-danger:hover { background: #f56565; }
        .message { padding: 15px; border-radius: 8px; margin-bottom: 20px; display: none; }
        .message.success { background: #c6f6d5; color: #22543d; display: block; }
        .message.error { background: #fed7d7; color: #742a2a; display: block; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Base64 编码/解码</h1>
            <a href="/" class="back-btn">← 返回目录</a>
        </header>
        <div id="message" class="message"></div>
        <div class="button-group">
            <button class="btn-primary" onclick="encodeBase64()">编码</button>
            <button class="btn-primary" onclick="decodeBase64()">解码</button>
            <button class="btn-secondary" onclick="swapText()">交换</button>
            <button class="btn-danger" onclick="clearAll()">清空</button>
        </div>
        <div class="editor-container">
            <div class="editor-box">
                <h3>输入文本</h3>
                <textarea id="input" placeholder="请输入要编码或解码的文本"></textarea>
            </div>
            <div class="editor-box">
                <h3>输出结果</h3>
                <textarea id="output" readonly placeholder="结果将显示在这里"></textarea>
            </div>
        </div>
    </div>
    <script>
        function showMessage(text, type) {
            const message = document.getElementById('message');
            message.textContent = text;
            message.className = 'message ' + type;
            setTimeout(() => { message.style.display = 'none'; }, 3000);
        }
        function encodeBase64() {
            const input = document.getElementById('input').value;
            if (!input.trim()) { showMessage('请输入要编码的文本', 'error'); return; }
            try {
                document.getElementById('output').value = btoa(unescape(encodeURIComponent(input)));
                showMessage('Base64 编码成功', 'success');
            } catch (e) { showMessage('编码失败: ' + e.message, 'error'); }
        }
        function decodeBase64() {
            const input = document.getElementById('input').value;
            if (!input.trim()) { showMessage('请输入要解码的 Base64 文本', 'error'); return; }
            try {
                document.getElementById('output').value = decodeURIComponent(escape(atob(input)));
                showMessage('Base64 解码成功', 'success');
            } catch (e) { showMessage('解码失败: 请输入有效的 Base64 字符串', 'error'); }
        }
        function swapText() {
            const input = document.getElementById('input');
            const output = document.getElementById('output');
            const temp = input.value;
            input.value = output.value;
            output.value = temp;
        }
        function clearAll() {
            document.getElementById('input').value = '';
            document.getElementById('output').value = '';
            document.getElementById('message').style.display = 'none';
        }
    </script>
</body>
</html>
