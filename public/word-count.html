<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>字数统计 - 在线工具箱</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #f7fafc;
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        header h1 { font-size: 1.8rem; }
        .back-btn {
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            border: 2px solid white;
            border-radius: 6px;
            transition: background 0.3s ease;
        }
        .back-btn:hover { background: rgba(255, 255, 255, 0.2); }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        .stat-card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .stat-number { font-size: 2.5rem; font-weight: bold; color: #667eea; margin-bottom: 10px; }
        .stat-label { color: #718096; font-size: 1rem; }
        .editor-box {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .editor-box h3 { margin-bottom: 15px; color: #2d3748; }
        textarea {
            width: 100%;
            height: 300px;
            padding: 15px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            font-size: 16px;
            resize: vertical;
            line-height: 1.6;
        }
        textarea:focus { outline: none; border-color: #667eea; }
        .button-group { display: flex; gap: 10px; margin-bottom: 20px; }
        button {
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.3s ease;
        }
        .btn-primary { background: #667eea; color: white; }
        .btn-primary:hover { background: #5a6fd6; }
        .btn-danger { background: #fc8181; color: white; }
        .btn-danger:hover { background: #f56565; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>字数统计</h1>
            <a href="/" class="back-btn">← 返回目录</a>
        </header>
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-number" id="charCount">0</div>
                <div class="stat-label">字符数</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="charCountNoSpace">0</div>
                <div class="stat-label">字符数（不含空格）</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="wordCount">0</div>
                <div class="stat-label">字数</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="lineCount">0</div>
                <div class="stat-label">行数</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="paragraphCount">0</div>
                <div class="stat-label">段落数</div>
            </div>
        </div>
        <div class="button-group">
            <button class="btn-primary" onclick="countStats()">统计</button>
            <button class="btn-danger" onclick="clearAll()">清空</button>
        </div>
        <div class="editor-box">
            <h3>输入文本</h3>
            <textarea id="input" placeholder="请输入要统计的文本..." oninput="countStats()"></textarea>
        </div>
    </div>
    <script>
        function countStats() {
            const text = document.getElementById('input').value;
            document.getElementById('charCount').textContent = text.length;
            document.getElementById('charCountNoSpace').textContent = text.replace(/\s/g, '').length;
            const chineseChars = text.match(/[\u4e00-\u9fa5]/g) || [];
            const englishWords = text.match(/[a-zA-Z]+/g) || [];
            document.getElementById('wordCount').textContent = chineseChars.length + englishWords.length;
            document.getElementById('lineCount').textContent = text ? text.split('\n').length : 0;
            document.getElementById('paragraphCount').textContent = text ? text.split('\n').filter(line => line.trim()).length : 0;
        }
        function clearAll() {
            document.getElementById('input').value = '';
            countStats();
        }
        countStats();
    </script>
</body>
</html>
