<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>随机密码生成器</title>
    <style>
        :root {
            --bg-main: #f4f6f9;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --accent-color: #2563eb;
            --accent-hover: #1d4ed8;
            --accent-light: #eff6ff;
            --border-color: #e2e8f0;
            --input-bg: #f8fafc;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            background-color: var(--card-bg);
            padding: 32px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 460px;
            box-sizing: border-box;
        }

        h2 {
            margin-top: 0;
            margin-bottom: 24px;
            font-size: 1.5rem;
            font-weight: 700;
            text-align: center;
            color: var(--text-main);
        }

        /* 密码展示区 */
        .result-container {
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            padding: 16px 20px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            transition: all 0.2s;
        }
        
        .result-container:hover {
            border-color: #cbd5e1;
        }

        #password-display {
            font-family: "JetBrains Mono", "Fira Code", Monaco, monospace;
            font-size: 1.25rem;
            letter-spacing: 0.5px;
            color: var(--text-main);
            word-break: break-all;
            user-select: all;
            padding-right: 12px;
        }

        .btn-copy {
            background-color: var(--accent-light);
            color: var(--accent-color);
            border: 1px solid rgba(37, 99, 235, 0.15);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.875rem;
            font-weight: 600;
            transition: all 0.15s;
            flex-shrink: 0;
        }

        .btn-copy:hover {
            background-color: var(--accent-color);
            color: #ffffff;
        }

        /* 滑块美化 */
        .setting-item {
            margin-bottom: 24px;
        }

        .label-group {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .label-group label {
            color: var(--text-muted);
            font-size: 0.95rem;
            font-weight: 500;
        }

        .length-val {
            font-family: monospace;
            font-size: 1.1rem;
            color: var(--accent-color);
            font-weight: 700;
        }

        .slider-container {
            display: flex;
            align-items: center;
        }

        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: #e2e8f0;
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: var(--accent-color);
            cursor: pointer;
            transition: transform 0.1s;
            box-shadow: 0 2px 4px rgba(37, 99, 235, 0.2);
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.15);
        }

        /* 复选框组 */
        .checkbox-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 28px;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #ffffff;
            padding: 12px 14px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            transition: all 0.15s;
        }

        .checkbox-item:hover {
            border-color: #cbd5e1;
            background-color: var(--input-bg);
        }

        .checkbox-left {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            user-select: none;
            flex-grow: 1;
        }

        /* 原生复选框美化 */
        input[type="checkbox"] {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border: 2px solid #cbd5e1;
            border-radius: 4px;
            outline: none;
            background-color: #fff;
            cursor: pointer;
            display: grid;
            place-content: center;
            transition: all 0.15s;
        }

        input[type="checkbox"]::before {
            content: "";
            width: 10px;
            height: 10px;
            transform: scale(0);
            transition: 120ms transform ease-in-out;
            background-color: #fff;
            clip-path: polygon(14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0%, 43% 62%);
        }

        input[type="checkbox"]:checked {
            background-color: var(--accent-color);
            border-color: var(--accent-color);
        }

        input[type="checkbox"]:checked::before {
            transform: scale(1);
        }

        .checkbox-left label {
            cursor: pointer;
            font-size: 0.95rem;
            color: #334155;
        }

        /* 自定义输入框 */
        .custom-spec-input {
            width: 130px;
            background-color: #ffffff;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 6px 10px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 0.9rem;
            outline: none;
            transition: all 0.15s;
            text-align: center;
        }

        .custom-spec-input:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        /* 主按钮 */
        .btn-generate {
            width: 100%;
            background-color: var(--accent-color);
            color: #ffffff;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.15s;
        }

        .btn-generate:hover {
            background-color: var(--accent-hover);
        }
        
        .btn-generate:active {
            transform: scale(0.99);
        }
    </style>
</head>
<body>

<div class="container">
    <h2>密码生成器</h2>
    
    <div class="result-container">
        <span id="password-display">点击生成</span>
        <button class="btn-copy" id="btn-copy" onclick="copyPassword()">复制</button>
    </div>

    <div class="setting-item">
        <div class="label-group">
            <label>密码长度</label>
            <span class="length-val" id="length-text">12</span>
        </div>
        <div class="slider-container">
            <input type="range" id="length-slider" min="4" max="32" value="12">
        </div>
    </div>

    <div class="checkbox-group">
        <div class="checkbox-item">
            <div class="checkbox-left" onclick="document.getElementById('uppercase').click()">
                <input type="checkbox" id="uppercase" checked onclick="event.stopPropagation()">
                <label>大写字母 (A-Z)</label>
            </div>
        </div>
        <div class="checkbox-item">
            <div class="checkbox-left" onclick="document.getElementById('lowercase').click()">
                <input type="checkbox" id="lowercase" checked onclick="event.stopPropagation()">
                <label>小写字母 (a-z)</label>
            </div>
        </div>
        <div class="checkbox-item">
            <div class="checkbox-left" onclick="document.getElementById('numbers').click()">
                <input type="checkbox" id="numbers" checked onclick="event.stopPropagation()">
                <label>数字 (0-9)</label>
            </div>
        </div>
        <div class="checkbox-item">
            <div class="checkbox-left" onclick="document.getElementById('symbols').click()">
                <input type="checkbox" id="symbols" checked onclick="event.stopPropagation()">
                <label>特殊字符</label>
            </div>
            <input type="text" id="custom-symbols" class="custom-spec-input" value="!@#$%^&*()_+" placeholder="自定义符号">
        </div>
    </div>

    <button class="btn-generate" onclick="generatePassword()">生成新密码</button>
</div>

<script>
    const lengthSlider = document.getElementById('length-slider');
    const lengthText = document.getElementById('length-text');
    const passwordDisplay = document.getElementById('password-display');
    const btnCopy = document.getElementById('btn-copy');
    
    const uppercaseEl = document.getElementById('uppercase');
    const lowercaseEl = document.getElementById('lowercase');
    const numbersEl = document.getElementById('numbers');
    const symbolsEl = document.getElementById('symbols');
    const customSymbolsEl = document.getElementById('custom-symbols');

    const charSets = {
        uppercase: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ',
        lowercase: 'abcdefghijklmnopqrstuvwxyz',
        numbers: '0123456789'
    };

    lengthSlider.addEventListener('input', (e) => {
        lengthText.innerText = e.target.value;
        generatePassword();
    });

    [uppercaseEl, lowercaseEl, numbersEl, symbolsEl].forEach(el => {
        el.addEventListener('change', generatePassword);
    });
    customSymbolsEl.addEventListener('input', () => {
        if(symbolsEl.checked) generatePassword();
    });

    function generatePassword() {
        const length = parseInt(lengthSlider.value);
        let allowedChars = '';
        let mandatoryChars = [];

        if (uppercaseEl.checked) {
            allowedChars += charSets.uppercase;
            mandatoryChars.push(charSets.uppercase[Math.floor(Math.random() * charSets.uppercase.length)]);
        }
        if (lowercaseEl.checked) {
            allowedChars += charSets.lowercase;
            mandatoryChars.push(charSets.lowercase[Math.floor(Math.random() * charSets.lowercase.length)]);
        }
        if (numbersEl.checked) {
            allowedChars += charSets.numbers;
            mandatoryChars.push(charSets.numbers[Math.floor(Math.random() * charSets.numbers.length)]);
        }
        if (symbolsEl.checked) {
            const customSymbols = customSymbolsEl.value;
            if (customSymbols.length > 0) {
                allowedChars += customSymbols;
                mandatoryChars.push(customSymbols[Math.floor(Math.random() * customSymbols.length)]);
            }
        }

        if (allowedChars.length === 0) {
            passwordDisplay.innerText = '请至少选择一项';
            passwordDisplay.style.color = '#ef4444'; // 错误提示红
            return;
        } else {
            passwordDisplay.style.color = 'var(--text-main)';
        }

        let generatedPassword = '';
        for (let i = 0; i < mandatoryChars.length && i < length; i++) {
            generatedPassword += mandatoryChars[i];
        }

        const remainingLength = length - generatedPassword.length;
        for (let i = 0; i < remainingLength; i++) {
            const randomIndex = Math.floor(Math.random() * allowedChars.length);
            generatedPassword += allowedChars[randomIndex];
        }

        generatedPassword = generatedPassword.split('').sort(() => Math.random() - 0.5).join('');
        passwordDisplay.innerText = generatedPassword;
        
        // 重置按钮样式
        btnCopy.innerText = '复制';
        btnCopy.style.backgroundColor = 'var(--accent-light)';
        btnCopy.style.color = 'var(--accent-color)';
        btnCopy.style.borderColor = 'rgba(37, 99, 235, 0.15)';
    }

    function copyPassword() {
        const password = passwordDisplay.innerText;
        if (password === '请至少选择一项' || password === '点击生成') return;
        
        navigator.clipboard.writeText(password).then(() => {
            btnCopy.innerText = '已复制!';
            btnCopy.style.backgroundColor = '#f0fdf4'; // 浅绿
            btnCopy.style.color = '#16a34a'; // 绿字
            btnCopy.style.borderColor = 'rgba(22, 163, 74, 0.2)';
        }).catch(err => {
            alert('复制失败，请手动复制');
        });
    }

    window.onload = generatePassword;
</script>

</body>
</html>
