<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>密码生成 - 在线工具箱</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #f7fafc;
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        header h1 { font-size: 1.8rem; }
        .back-btn {
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            border: 2px solid white;
            border-radius: 6px;
            transition: background 0.3s ease;
        }
        .back-btn:hover { background: rgba(255, 255, 255, 0.2); }
        .generator-box {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            max-width: 600px;
            margin: 0 auto;
        }
        .password-display {
            background: #f8f9fa;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            padding: 20px;
            font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
            font-size: 1.5rem;
            text-align: center;
            margin-bottom: 20px;
            word-break: break-all;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .options { margin-bottom: 25px; }
        .option-group { margin-bottom: 20px; }
        .option-group label { display: block; margin-bottom: 8px; color: #4a5568; font-weight: 500; }
        .slider-container { display: flex; align-items: center; gap: 15px; }
        input[type="range"] {
            flex: 1;
            height: 8px;
            -webkit-appearance: none;
            background: #e2e8f0;
            border-radius: 4px;
            outline: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            background: #667eea;
            border-radius: 50%;
            cursor: pointer;
        }
        .length-value { font-size: 1.2rem; font-weight: bold; color: #667eea; min-width: 40px; text-align: center; }
        .checkbox-group { display: flex; flex-wrap: wrap; gap: 15px; }
        .checkbox-item { display: flex; align-items: center; gap: 8px; }
        input[type="checkbox"] { width: 18px; height: 18px; accent-color: #667eea; }
        .button-group { display: flex; gap: 10px; }
        button {
            padding: 14px 28px;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.3s ease;
            flex: 1;
        }
        .btn-primary { background: #667eea; color: white; }
        .btn-primary:hover { background: #5a6fd6; }
        .btn-secondary { background: #e2e8f0; color: #4a5568; }
        .btn-secondary:hover { background: #cbd5e0; }
        .copy-message { text-align: center; color: #48bb78; margin-top: 10px; display: none; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>密码生成</h1>
            <a href="/" class="back-btn">← 返回目录</a>
        </header>
        <div class="generator-box">
            <div class="password-display" id="passwordDisplay">点击生成密码</div>
            <div class="options">
                <div class="option-group">
                    <label>密码长度: <span id="lengthValue">16</span></label>
                    <div class="slider-container">
                        <input type="range" id="lengthSlider" min="4" max="64" value="16" oninput="updateLength()">
                        <span class="length-value" id="lengthDisplay">16</span>
                    </div>
                </div>
                <div class="option-group">
                    <label>字符类型:</label>
                    <div class="checkbox-group">
                        <div class="checkbox-item">
                            <input type="checkbox" id="uppercase" checked>
                            <label for="uppercase">大写字母 (A-Z)</label>
                        </div>
                        <div class="checkbox-item">
                            <input type="checkbox" id="lowercase" checked>
                            <label for="lowercase">小写字母 (a-z)</label>
                        </div>
                        <div class="checkbox-item">
                            <input type="checkbox" id="numbers" checked>
                            <label for="numbers">数字 (0-9)</label>
                        </div>
                        <div class="checkbox-item">
                            <input type="checkbox" id="symbols" checked>
                            <label for="symbols">特殊字符 (!@#$...)</label>
                        </div>
                    </div>
                </div>
            </div>
            <div class="button-group">
                <button class="btn-primary" onclick="generatePassword()">生成密码</button>
                <button class="btn-secondary" onclick="copyPassword()">复制密码</button>
            </div>
            <div class="copy-message" id="copyMessage">密码已复制到剪贴板！</div>
        </div>
    </div>
    <script>
        function updateLength() {
            const value = document.getElementById('lengthSlider').value;
            document.getElementById('lengthValue').textContent = value;
            document.getElementById('lengthDisplay').textContent = value;
        }
        function generatePassword() {
            const length = parseInt(document.getElementById('lengthSlider').value);
            let charset = '';
            if (document.getElementById('uppercase').checked) charset += 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
            if (document.getElementById('lowercase').checked) charset += 'abcdefghijklmnopqrstuvwxyz';
            if (document.getElementById('numbers').checked) charset += '0123456789';
            if (document.getElementById('symbols').checked) charset += '!@#$%^&*()_+-=[]{}|;:,.<>?';
            if (!charset) { alert('请至少选择一种字符类型'); return; }
            const array = new Uint32Array(length);
            crypto.getRandomValues(array);
            let password = '';
            for (let i = 0; i < length; i++) { password += charset[array[i] % charset.length]; }
            document.getElementById('passwordDisplay').textContent = password;
        }
        function copyPassword() {
            const password = document.getElementById('passwordDisplay').textContent;
            if (password === '点击生成密码') { alert('请先生成密码'); return; }
            navigator.clipboard.writeText(password).then(() => {
                const message = document.getElementById('copyMessage');
                message.style.display = 'block';
                setTimeout(() => { message.style.display = 'none'; }, 2000);
            }).catch(() => {
                const textarea = document.createElement('textarea');
                textarea.value = password;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                const message = document.getElementById('copyMessage');
                message.style.display = 'block';
                setTimeout(() => { message.style.display = 'none'; }, 2000);
            });
        }
        generatePassword();
    </script>
</body>
</html>
